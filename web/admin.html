<!-- ================= MODAL ADD DOSEN ================= -->
<div class="modal fade" id="modalAddDosen" tabindex="-1" role="dialog">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<form id="formAddDosen">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
					<h4 class="modal-title" id="myModalLabel">Tambah Dosen Baru</h4>
				</div>
				<div class="modal-body">
					<div class="form-group">
						<label for="dosen_id">Dosen ID</label>
						<input type="text" class="form-control" id="dosen_id" placeholder="Contoh: DSN001" required>
					</div>
					<div class="form-group">
						<label for="dosen_name">Nama Dosen</label>
						<input type="text" class="form-control" id="dosen_name" placeholder="Masukkan nama lengkap" required>
					</div>
					<p class="text-muted"><small>*Password default akan di-set otomatis menjadi <b>1234567</b>. Foto profil bisa diunggah oleh dosen setelah login.</small></p>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
					<button type="submit" class="btn btn-primary" id="btnSaveDosen">Simpan</button>
				</div>
			</form>
		</div>
	</div>
</div>

	<!-- ================= CUSTOM SCRIPT FOR ADMIN ================= -->
	<script>
		let tableDosen;

		// Load data dosen ke datatables
		function loadDosen() {
			// Hancurkan datatable lama jika ada (untuk reload)
			if ($.fn.DataTable.isDataTable('#tabelDosen')) {
				$('#tabelDosen').DataTable().destroy();
			}

			$('#tabelDosen').DataTable({
				"ajax": {
					"url": "/api/dosen", // Nginx akan meneruskan ini ke backend
					"dataSrc": ""
				},
				"columns": [
					{ "data": "dosen_id" },
					{ "data": "dosen_name" },
					{ 
						"data": "dosen_image",
						"render": function(data, type, row) {
							if (data) {
								return `<img src="/api/uploads/${data}" alt="Foto" style="width: 40px; height: 40px; object-fit: cover; border-radius: 50%;">`;
							} else {
								return '<span class="label label-default">Belum ada foto</span>';
							}
						}
					}
				]
			});
		}

		// Handle form submit (Tambah Dosen)
		$('#formAddDosen').on('submit', function(e) {
			e.preventDefault();
			
			const dosen_id = $('#dosen_id').val();
			const dosen_name = $('#dosen_name').val();
			const btn = $('#btnSaveDosen');

			btn.prop('disabled', true).text('Menyimpan...');

			$.ajax({
				url: '/api/dosen',
				method: 'POST',
				contentType: 'application/json',
				data: JSON.stringify({ dosen_id: dosen_id, dosen_name: dosen_name }),
				success: function(response) {
					$('#modalAddDosen').modal('hide');
					$('#formAddDosen')[0].reset();
					swal("Berhasil!", response.message, "success");
					loadDosen(); // Reload tabel
				},
				error: function(xhr) {
					const errMsg = xhr.responseJSON ? xhr.responseJSON.error : 'Terjadi kesalahan sistem.';
					swal("Gagal!", errMsg, "error");
				},
				complete: function() {
					btn.prop('disabled', false).text('Simpan');
				}
			});
		});

		// Logout function
		function logout() {
			swal({
				title: "Logout?",
				text: "Anda akan keluar dari halaman admin.",
				type: "warning",
				showCancelButton: true,
				confirmButtonColor: "#DD6B55",
				confirmButtonText: "Ya, Logout!",
				closeOnConfirm: true
			}, function() {
				localStorage.removeItem('admin_auth');
				window.location.href = 'index.html';
			});
		}

		// Inisialisasi saat halaman siap
		$(document).ready(function() {
			loadDosen();
		});
	</script>
