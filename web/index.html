	<script src="assets/plugin/datatables/extensions/Responsive/js/dataTables.responsive.min.js"></script>
	<script src="assets/plugin/datatables/extensions/Responsive/js/responsive.bootstrap.min.js"></script>
	
	<script src="assets/scripts/main.min.js"></script>
	<script src="assets/color-switcher/color-switcher.min.js"></script>

	<!-- ================= CUSTOM SCRIPT FOR INDEX ================= -->
	<script>
		$(document).ready(function() {
			$('#tabelPenelitian').DataTable({
				"ajax": {
					"url": "/api/penelitian", // Fetch data from backend
					"dataSrc": ""
				},
				"columns": [
					{ 
						// Auto increment number based on pagination
						"data": null,
						"render": function (data, type, row, meta) {
							return meta.row + meta.settings._iDisplayStart + 1;
						}
					},
					{ "data": "dosen_name" },
					{ "data": "judul_penelitian" },
					{ "data": "tahun_penelitian" },
					{ 
						"data": "status_penelitian",
						"render": function(data) {
							// Added colored badges just like in dosen.html
							let badge = data === 'Berjalan' ? 'label-warning' : 'label-success';
							return `<span class="label ${badge}">${data}</span>`;
						}
					},
					{ 
						"data": "hasil_publikasi",
						"render": function(data, type, row) {
							// Parse the JSON array of filenames safely
							if (data) {
								try {
									// Handle both string JSON and already parsed Arrays from the DB
									const files = typeof data === 'string' ? JSON.parse(data) : data;
									
									if (Array.isArray(files) && files.length > 0) {
										let html = '<ul class="file-list">';
										files.forEach(f => {
											html += `<li><a href="/api/uploads/${f}" target="_blank"><i class="fa fa-file-pdf-o text-danger"></i> ${f}</a></li>`;
										});
										html += '</ul>';
										return html;
									}
								} catch (e) {
									console.error("Failed to parse JSON", e);
								}
							}
							return '<span class="text-muted">-</span>';
						}
					}
				],
				"order": [[ 3, "desc" ]] // Sort by Year (descending) by default
			});
		});
	</script>
