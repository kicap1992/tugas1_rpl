services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: karan456
      MARIADB_DATABASE: tugas1_rpl
      MARIADB_USER: karan
      MARIADB_PASSWORD: karan456
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"   
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./be
    container_name: api
    depends_on:
      db:
        condition: service_healthy # Pastikan DB siap sebelum API jalan
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=karan
      - DB_PASSWORD=karan456
      - DB_NAME=tugas1_rpl
      - DB_PORT=3306
    volumes:
      - ./be/uploads:/app/uploads  # <--- ADD THIS LINE

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "8084:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data: